services:
  - type: web
    name: whatsapp-pdf-sender
    env: node
    plan: free
    buildCommand: npm run install:all && PUPPETEER_CACHE_DIR=/opt/render/.cache/puppeteer npm exec --prefix server -- puppeteer browsers install chrome && npm run build --prefix client
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/.cache/puppeteer
